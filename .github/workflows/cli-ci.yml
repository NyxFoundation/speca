name: cli-ci

# Everything vendor-core.mjs copies into cli/vendor/speca-core is CLI runtime
# surface shipped to npm users, so a change there can break `speca run` without
# touching cli/ at all. The path lists below must stay a superset of that
# payload (see cli/scripts/vendor-core.mjs: SCRIPT_FILES, TREES, and the
# pyproject.toml keys it reads) — otherwise the e2e jobs that exist to guard it
# never run on the very commit that breaks it.
on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "scripts/__init__.py"
      - "scripts/run_phase.py"
      - "scripts/orchestrator/**"
      - "prompts/**"
      - ".claude/skills/**"
      - "pyproject.toml"
      - "scripts/export_schemas.py"
      - "schemas/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "cli/**"
      - "scripts/__init__.py"
      - "scripts/run_phase.py"
      - "scripts/orchestrator/**"
      - "prompts/**"
      - ".claude/skills/**"
      - "pyproject.toml"
      - "scripts/export_schemas.py"
      - "schemas/**"
      - ".github/workflows/cli-ci.yml"

jobs:
  build:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install uv (so `speca doctor` and the Python contract test pass)
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - name: Install Python toolchain via uv (required for events contract test)
        run: uv python install 3.11
      - name: Sync project Python deps (Pydantic for the emitter)
        run: uv sync
      - name: npm ci
        working-directory: cli
        run: npm ci
      - name: typecheck
        working-directory: cli
        run: npm run typecheck
      - name: build
        working-directory: cli
        run: npm run build
      - name: schemas in sync (orchestrator → schemas/)
        run: uv run python scripts/export_schemas.py --check
      - name: schemas in sync (schemas/ → cli/src/lib/schemas/generated/)
        working-directory: cli
        # Re-running sync-schemas should be a no-op on a clean checkout. If
        # files differ, the developer forgot to commit the regenerated copies.
        run: |
          npm run sync-schemas
          git diff --exit-code -- src/lib/schemas/generated
        shell: bash
      - name: vitest (incl. Python ↔ TS event contract + coverage gate)
        working-directory: cli
        # The coverage thresholds in vitest.config.ts gate the build; a
        # significant drop in line/branch coverage on `lib/**` fails CI.
        run: npx vitest run --coverage
      - name: speca doctor smoke test (built bundle)
        working-directory: cli
        run: node dist/cli.js doctor
      - name: speca version smoke test
        working-directory: cli
        run: node dist/cli.js version
      - name: speca run --help smoke test (M3)
        working-directory: cli
        run: node dist/cli.js run --help

  e2e-orchestrator:
    name: e2e — orchestrator NDJSON ↔ CLI Zod
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv python install 3.11
      - run: uv sync
      - name: npm ci
        working-directory: cli
        run: npm ci
      - name: build CLI
        working-directory: cli
        run: npm run build
      - name: Run orchestrator on Phase 01b (depfail) — capture NDJSON
        run: |
          set -euo pipefail
          mkdir -p /tmp/speca-e2e
          cd /tmp/speca-e2e
          # Phase 01b in an empty directory hits the dependency check fast
          # and emits the full lifecycle (started/failed/completed).
          uv run --project ${{ github.workspace }} python ${{ github.workspace }}/scripts/run_phase.py \
            --phase 01b --json > events.ndjson 2> orchestrator.stderr || true
          wc -l events.ndjson
          head -1 events.ndjson
      - name: Validate NDJSON against the generated TS Zod schema
        working-directory: cli
        # Script is written under `cli/` (not `/tmp/`) so its relative
        # `./dist/lib/pipeline/events.js` import resolves correctly. Earlier
        # we wrote to `/tmp/validate.mjs` and hit ERR_MODULE_NOT_FOUND when
        # Node resolved `./dist/...` against the script's directory.
        run: |
          set -euo pipefail
          cat > validate-events.mjs <<'NODE'
          import { readFileSync } from "node:fs";
          import { pipelineEventSchema } from "./dist/lib/pipeline/events.js";
          const lines = readFileSync("/tmp/speca-e2e/events.ndjson", "utf8")
            .split("\n").filter((l) => l.trim().length > 0);
          if (lines.length === 0) {
            console.error("no NDJSON lines emitted");
            process.exit(1);
          }
          const seen = new Set();
          for (const line of lines) {
            const r = pipelineEventSchema.safeParse(JSON.parse(line));
            if (!r.success) {
              console.error("Zod rejected line:", line);
              console.error(JSON.stringify(r.error.issues, null, 2));
              process.exit(1);
            }
            seen.add(r.data.type);
          }
          for (const required of ["pipeline-started", "phase-started", "phase-failed", "pipeline-completed"]) {
            if (!seen.has(required)) {
              console.error("missing event type:", required, "saw:", [...seen]);
              process.exit(1);
            }
          }
          console.log("OK — validated", lines.length, "events covering", [...seen].join(", "));
          NODE
          node validate-events.mjs
          rm -f validate-events.mjs

  # Reproduces issue #95 end-to-end: the BUILT CLI, invoked from a directory
  # outside the checkout, must reach the orchestrator through the VENDORED
  # core (cli/vendor/speca-core). The e2e-orchestrator job above exercises
  # `uv run --project <checkout>` directly and bypasses the CLI entirely, so
  # it stays green even when spawn.ts / resolveCoreRoot are broken.
  #
  # Runs on ubuntu, macos AND windows: #95 was reported on macOS, and the fix
  # carries platform-specific code (spawn.ts picks `python`, not `python3` —
  # a Windows-only distinction — and defaultVenvDir deliberately uses
  # ~/.cache on every platform rather than ~/Library/Caches). The
  # windows-2022 leg (issue #99) exists precisely because those Windows-only
  # branches used to be exercised nowhere: the build matrix only smoke-tests
  # `doctor` from inside the checkout. All steps use `shell: bash` (Git Bash
  # on Windows); the two OS-dependent bits are the venv interpreter layout
  # (bin/python vs Scripts/python.exe) and path separators — the latter is
  # neutralized by computing the expected core root and venv hash key through
  # resolveCoreRoot() itself (see the "resolve core root" step) instead of
  # re-deriving them with shell string concatenation.
  e2e-foreign-cwd:
    # Quoted: in an unquoted YAML scalar a " #" starts a comment, which would
    # silently truncate this name to "e2e — issue" and drop the matrix suffix,
    # leaving both legs reporting the same check name.
    name: "e2e — issue #95, built CLI from a foreign cwd (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
      - run: uv python install 3.11
      - name: npm ci
        working-directory: cli
        run: npm ci
      - name: build CLI (vendors the Python core + uv.lock)
        working-directory: cli
        # `npm run build` runs vendor-core.mjs first; with uv on PATH it also
        # generates vendor/speca-core/uv.lock — the exact payload npm users get.
        run: npm run build
      - name: resolve core root exactly as the CLI does
        id: core
        working-directory: cli
        shell: bash
        # Ask resolveCoreRoot() itself for the core root and hash ITS return
        # value, instead of re-deriving the path with shell string
        # concatenation. On Windows resolveCoreRoot() returns a
        # backslash-separated path (path.join), while "${GITHUB_WORKSPACE}/cli/..."
        # would mix separators — the sha256 venv key and the doctor-output
        # grep below must match the CLI's own byte-for-byte string, so any
        # re-derivation is structurally fragile (issue #99).
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { createHash } from "node:crypto";
            import { pathToFileURL } from "node:url";
            import { resolve } from "node:path";
            const mod = await import(pathToFileURL(resolve("dist/lib/core-root.js")).href);
            const root = mod.resolveCoreRoot();
            const key = createHash("sha256").update(root).digest("hex").slice(0, 16);
            console.log(`root=${root}`);
            console.log(`venv-key=${key}`);
          ' | tee -a "${GITHUB_OUTPUT}"
      - name: speca doctor from a foreign cwd — core resolves to the vendored copy
        shell: bash
        env:
          EXPECTED_CORE_ROOT: ${{ steps.core.outputs.root }}
        run: |
          set -euo pipefail
          # RUNNER_TEMP, not a hardcoded /tmp: it is the documented per-job
          # scratch dir on every runner image and sits outside the checkout,
          # which is the whole point — no speca repo anywhere above the cwd.
          mkdir -p "${RUNNER_TEMP}/speca-issue95"
          cd "${RUNNER_TEMP}/speca-issue95"
          # The vendored copy must be what resolution produced — otherwise
          # this job would silently test the wrong core.
          case "${EXPECTED_CORE_ROOT}" in
            *vendor*speca-core) ;;
            *) echo "resolveCoreRoot() did not pick the vendored core: ${EXPECTED_CORE_ROOT}"; exit 1 ;;
          esac
          # FORCE_COLOR=0: chalk turns ANSI on under GitHub Actions even
          # without a TTY, and escape codes between "[OK]" and the check name
          # would break the greps below.
          FORCE_COLOR=0 node "${GITHUB_WORKSPACE}/cli/dist/cli.js" doctor | tee doctor.txt
          # resolveCoreRoot() is vendor-first in the dist layout; the `core`
          # check must report the VENDORED copy, not the checkout root.
          grep -E "\[OK\] +core" doctor.txt
          # Ink soft-wraps long lines at 80 columns under a pipe, which can
          # split the reported path across lines — strip ALL whitespace before
          # matching it (the runner workspace path contains none). `tr -d`
          # specifically: newline is in [:space:], so this also RE-JOINS a
          # wrapped path into one line, which a per-line `sed s///g` would not
          # do. [:class:] in -d mode is POSIX and works on both GNU and BSD tr.
          # grep -F: EXPECTED_CORE_ROOT contains backslashes on Windows and
          # must be matched literally, never as a regex.
          tr -d "[:space:]" < doctor.txt | grep -F "${EXPECTED_CORE_ROOT}"
      - name: speca run from a foreign cwd — full lifecycle via the bundled core
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/speca-issue95"
          # Pre-fix code spawned `uv run python3 scripts/run_phase.py` with a
          # cwd-relative script path, so outside a speca checkout it emitted
          # NO events (issue #95). Phase 01b in an empty directory hits the
          # dependency check fast and emits the full lifecycle
          # (started/failed/completed) — a NON-ZERO exit is expected here, so
          # assert on the emitted events, never on the exit code.
          node "${GITHUB_WORKSPACE}/cli/dist/cli.js" run --phase 01b --json \
            > events.ndjson 2> run.stderr || true
          echo "--- run.stderr ---"; cat run.stderr
          echo "--- events.ndjson ---"; cat events.ndjson
          # A failed core resolution or missing uv is routed to spawn-error +
          # exit 127 with an empty event stream — these asserts fail loudly
          # on that, which is exactly the #95 symptom.
          test -s events.ndjson
          for required in pipeline-started phase-started phase-failed pipeline-completed; do
            grep -q "\"type\":\"${required}\"" events.ndjson
          done
          echo "OK — orchestrator lifecycle observed from a foreign cwd"
      - name: venv keyed to the VENDORED core root (proof the bundled copy ran)
        shell: bash
        env:
          VENV_KEY: ${{ steps.core.outputs.venv-key }}
        run: |
          set -euo pipefail
          # spawn.ts sets UV_PROJECT_ENVIRONMENT to
          # <cache>/speca/venvs/<sha256(coreRoot)[:16]> (see defaultVenvDir),
          # so the venv path encodes WHICH core root the run resolved. The key
          # comes from the "resolve core root" step, which hashed the exact
          # string defaultVenvDir hashes at runtime. Had the run resolved the
          # checkout root instead of the vendored copy, this directory would
          # not exist.
          venv="${XDG_CACHE_HOME:-$HOME/.cache}/speca/venvs/${VENV_KEY}"
          echo "expecting venv at: ${venv}"
          # uv venv layout is OS-specific: bin/python on POSIX,
          # Scripts/python.exe on Windows (there is no python3 shim there —
          # the very branch spawn.ts carries and the reason this leg exists).
          if [ "${RUNNER_OS}" = "Windows" ]; then
            test -x "${venv}/Scripts/python.exe"
          else
            test -x "${venv}/bin/python"
          fi
