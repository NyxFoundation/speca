name: Security Analysis Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  spec:
    uses: ./.github/workflows/spec-generation.yml
    with:
      target_directory: '.'
    secrets: inherit

  audit-map:
    needs: spec
    uses: ./.github/workflows/audit-map-generation.yml
    with:
      spec_artifact: ${{ needs.spec.outputs.artifact_id }}
    secrets: inherit

  review:
    needs: audit-map
    uses: ./.github/workflows/vulnerability-review.yml
    with:
      audit_artifact: ${{ needs.audit-map.outputs.artifact_id }}
    secrets: inherit

  poc:
    needs: review
    if: ${{ needs.review.outputs.vulnerabilities != '[]' }}
    uses: ./.github/workflows/poc-generation.yml
    with:
      vulnerabilities: ${{ needs.review.outputs.vulnerabilities }}
    secrets: inherit

  report:
    needs: [spec, audit-map, review, poc]
    if: always()
    uses: ./.github/workflows/report-generation.yml
    with:
      has_vulnerabilities: ${{ needs.review.outputs.vulnerabilities != '[]' }}
    secrets: inherit