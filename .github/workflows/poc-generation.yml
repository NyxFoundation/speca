name: PoC Generation

on:
  workflow_call:
    inputs:
      vulnerabilities:
        required: true
        type: string
        description: 'JSON array of vulnerability IDs to generate PoCs for'

jobs:
  generate-poc:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        vulnerability: ${{ fromJson(inputs.vulnerabilities) }}
      max-parallel: 5
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download previous artifacts
        uses: actions/download-artifact@v4
        with:
          path: outputs/
          
      - name: Generate Unit PoC for ${{ matrix.vulnerability }}
        uses: anthropics/claude-code-action@beta
        timeout-minutes: 30
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          model: claude-3-5-sonnet-20241022
          max_thinking_tokens: 20000
          prompt: |
            Execute the security analysis prompt located at prompts/whitehat/03a_POC_UNIT.md
            
            Generate a Proof of Concept for vulnerability ID: ${{ matrix.vulnerability }}
            
            Use the vulnerability details from: outputs/reviewed-vulnerabilities/reviewed_vulnerabilities.json
            Also reference the audit map from: outputs/audit-map-output/WHITEHAT_02_AUDITMAP.json
            
            The prompt requires you to:
            1. Create a minimal, isolated PoC that demonstrates the vulnerability
            2. Include setup instructions and prerequisites
            3. Show the exact steps to reproduce
            4. Demonstrate the impact clearly
            5. Generate test code that can be executed
            
            Save outputs to: outputs/poc/${{ matrix.vulnerability }}/unit/
            - poc_code.sol (or appropriate extension)
            - setup_instructions.md
            - execution_steps.md
            - expected_results.md
            
            Ensure the PoC is:
            - Safe to run (no destructive actions)
            - Minimal and focused
            - Well-documented
            - Reproducible
      
      - name: Generate Integration PoC for ${{ matrix.vulnerability }}
        uses: anthropics/claude-code-action@beta
        timeout-minutes: 30
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          model: claude-3-5-sonnet-20241022
          max_thinking_tokens: 20000
          prompt: |
            Execute the security analysis prompt located at prompts/whitehat/03b_POC_INTEGRATION.md
            
            Generate an Integration Proof of Concept for vulnerability ID: ${{ matrix.vulnerability }}
            
            Use the unit PoC from: outputs/poc/${{ matrix.vulnerability }}/unit/
            Reference the vulnerability details and audit map as before.
            
            The prompt requires you to:
            1. Extend the unit PoC to show real-world exploitation
            2. Demonstrate the vulnerability in a realistic scenario
            3. Show potential attack chains and composability issues
            4. Calculate potential economic impact
            5. Generate integration test code
            
            Save outputs to: outputs/poc/${{ matrix.vulnerability }}/integration/
            - integration_poc.sol (or appropriate extension)
            - attack_scenario.md
            - economic_impact.md
            - mitigation_suggestions.md
            
            Focus on:
            - Real-world applicability
            - Economic feasibility
            - Attack complexity
            - Defense recommendations
      
      - name: Verify PoC outputs
        run: |
          VULN_ID="${{ matrix.vulnerability }}"
          POC_DIR="outputs/poc/$VULN_ID"
          
          # Check unit PoC files
          if [ ! -d "$POC_DIR/unit" ]; then
            echo "Error: Unit PoC directory not found for $VULN_ID"
            exit 1
          fi
          
          # Check integration PoC files
          if [ ! -d "$POC_DIR/integration" ]; then
            echo "Error: Integration PoC directory not found for $VULN_ID"
            exit 1
          fi
          
          echo "PoC generation successful for $VULN_ID"
          
      - name: Upload PoC artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poc-${{ matrix.vulnerability }}
          path: outputs/poc/${{ matrix.vulnerability }}/
          retention-days: 7