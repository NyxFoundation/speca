name: SPEC Generation

on:
  workflow_call:
    inputs:
      target_directory:
        required: true
        type: string
        description: 'Target directory for security analysis'
    outputs:
      artifact_id:
        description: 'Artifact ID of the generated SPEC'
        value: ${{ jobs.generate.outputs.artifact_id }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Generate SPEC with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          model: claude-3-5-sonnet-20241022
          max_thinking_tokens: 10000
          prompt: |
            Execute the security analysis prompt located at prompts/whitehat/01_SPEC.md
            
            Replace the following variables in the prompt:
            - TARGET_DIRECTORY: ${{ github.workspace }}/${{ inputs.target_directory }}
            - DOCUMENT_DIRECTORY: ${{ github.workspace }}/docs
            
            The prompt requires you to:
            1. Analyze the project structure and documentation
            2. Identify the project's purpose and functionality
            3. Extract security-relevant specifications
            4. Generate a structured JSON output
            
            Save the final output to: outputs/WHITEHAT_01_SPEC.json
            
            Ensure the output directory exists before saving.
      
      - name: Verify output exists
        run: |
          if [ ! -f outputs/WHITEHAT_01_SPEC.json ]; then
            echo "Error: SPEC output file not found"
            exit 1
          fi
          echo "SPEC generation successful"
          
      - name: Upload SPEC artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: spec-output
          path: outputs/WHITEHAT_01_SPEC.json
          retention-days: 7