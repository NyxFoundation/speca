name: Audit Map Generation

on:
  workflow_call:
    inputs:
      spec_artifact:
        required: true
        type: string
        description: 'Artifact ID from SPEC generation'
    outputs:
      artifact_id:
        description: 'Artifact ID of the generated audit map'
        value: ${{ jobs.generate.outputs.artifact_id }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download SPEC artifact
        uses: actions/download-artifact@v4
        with:
          name: spec-output
          path: outputs/
          
      - name: Generate Audit Map with Claude
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          mode: agent
          model: claude-3-5-sonnet-20241022
          max_thinking_tokens: 15000
          prompt: |
            Execute the security analysis prompt located at prompts/whitehat/02_AUDITMAP.md
            
            Use the SPEC data from: outputs/WHITEHAT_01_SPEC.json
            
            Replace the following variables in the prompt:
            - TARGET_DIRECTORY: ${{ github.workspace }}
            - SOURCE_PATH: ${{ github.workspace }}
            
            The prompt requires you to:
            1. Analyze the codebase structure based on the SPEC
            2. Identify critical security areas and mark them with @audit flags
            3. Map dependencies and data flows
            4. Generate potential vulnerability hypotheses
            5. Create a structured JSON output with audit priorities
            
            Save the final output to: outputs/WHITEHAT_02_AUDITMAP.json
            
            Focus on:
            - Access control mechanisms
            - State-changing functions
            - External integrations
            - Economic logic
            - Data validation points
      
      - name: Verify output exists
        run: |
          if [ ! -f outputs/WHITEHAT_02_AUDITMAP.json ]; then
            echo "Error: Audit Map output file not found"
            exit 1
          fi
          echo "Audit Map generation successful"
          
      - name: Upload Audit Map artifact
        uses: actions/upload-artifact@v4
        id: upload
        with:
          name: audit-map-output
          path: outputs/WHITEHAT_02_AUDITMAP.json
          retention-days: 7