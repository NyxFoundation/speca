name: "graph-02c accuracy gate (#157)"

# Deterministic graph-based 02c: assert the resolver's recall on the vendored
# benchmark stays high and the LLM-fallback rate stays bounded. Runs on changes
# to the resolver or its benchmark. No network, no client clone.
on:
  pull_request:
    paths:
      - 'experiments/graph_02c/**'
      - '.github/workflows/graph-02c-eval.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Accuracy gate
        run: |
          uv run --with tree-sitter --with tree-sitter-language-pack \
            --with tree-sitter-c-sharp \
            python3 -m experiments.graph_02c.eval_cli \
            --recall-min 1.0 --fallback-max 0.0
